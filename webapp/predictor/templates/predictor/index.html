<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heart Disease Prediction</title>
    <style>
        body {
            background-color: #2c3e50;
            color: #ecf0f1;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            padding: 10px;
            box-sizing: border-box;
        }
        h1 {
            text-align: center;
            font-size: 1.2em;
            margin-bottom: 20px;
        }
        form {
            background-color: #34495e;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
            width: 600px;
            text-align: left;
        }
        .form-group {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            margin-bottom: 10px;
        }
        .form-group label {
            width: 48%;
            margin-bottom: 8px;
            font-size: 0.8em;
        }
        .form-group input,
        .form-group select {
            width: 48%;
            padding: 6px;
            border-radius: 4px;
            border: none;
            background-color: #ecf0f1;
            color: #2c3e50;
            margin-bottom: 8px;
        }
        input[type="submit"] {
            background-color: #e74c3c;
            color: #ecf0f1;
            cursor: pointer;
            font-size: 0.8em;
            padding: 8px;
            margin-top: 10px;
            width: 100%;
        }
        input[type="submit"]:hover {
            background-color: #c0392b;
        }
        .result {
            text-align: center;
            margin-top: 10px;
            font-size: 0.8em;
            font-weight: bold;
        }
    </style>
</head>
<body>
<h1>Heart Disease Prediction</h1>
<form method="post">
    {% csrf_token %}
    <div class="form-group">
        <label for="age">Age:</label>
        <input type="number" id="age" name="age" required>

        <label for="sex">Sex:</label>
        <select id="sex" name="sex" required>
            <option value="male">Male</option>
            <option value="female">Female</option>
        </select>
    </div>

    <div class="form-group">
        <label for="chest_pain">Chest Pain Type:</label>
        <select id="chest_pain" name="chest_pain" required>
            <option value="typical angina">Typical Angina</option>
            <option value="atypical angina">Atypical Angina</option>
            <option value="non-anginal pain">Non-Anginal Pain</option>
            <option value="asymptomatic">Asymptomatic</option>
        </select>

        <label for="bp">Blood Pressure:</label>
        <input type="number" id="bp" name="bp" required>
    </div>

    <div class="form-group">
        <label for="cholesterol">Cholesterol:</label>
        <input type="number" id="cholesterol" name="cholesterol" required>

        <label for="fbs">FBS over 120:</label>
        <select id="fbs" name="fbs" required>
            <option value="yes">Yes</option>
            <option value="no">No</option>
        </select>
    </div>

    <div class="form-group">
        <label for="ekg">EKG Results:</label>
        <select id="ekg" name="ekg" required>
            <option value="normal">Normal</option>
            <option value="having ST-T wave abnormality">Having ST-T wave abnormality</option>
            <option value="showing probable or definite left ventricular hypertrophy">Showing probable or definite left ventricular hypertrophy</option>
        </select>

        <label for="max_hr">Maximum Heart Rate:</label>
        <input type="number" id="max_hr" name="max_hr" required>
    </div>

    <div class="form-group">
        <label for="exercise_angina">Exercise Induced Angina:</label>
        <select id="exercise_angina" name="exercise_angina" required>
            <option value="yes">Yes</option>
            <option value="no">No</option>
        </select>

        <label for="st_depression">ST Depression:</label>
        <input type="number" step="0.1" id="st_depression" name="st_depression" required>
    </div>

    <div class="form-group">
        <label for="slope_of_st">Slope of ST:</label>
        <select id="slope_of_st" name="slope_of_st" required>
            <option value="upsloping">Upsloping</option>
            <option value="flat">Flat</option>
            <option value="downsloping">Downsloping</option>
        </select>

        <label for="num_vessels">Number of Major Vessels:</label>
        <input type="number" id="num_vessels" name="num_vessels" min="0" max="3" required>
    </div>

    <div class="form-group">
        <label for="thallium">Thallium Stress Test Result:</label>
        <select id="thallium" name="thallium" required>
            <option value="normal">Normal</option>
            <option value="fixed defect">Fixed Defect</option>
            <option value="reversible defect">Reversible Defect</option>
        </select>
    </div>

    <input type="submit" value="Submit">

    {% if result %}
    <div class="result">{{ result }}</div>
    {% endif %}
</form>
</body>
</html>
